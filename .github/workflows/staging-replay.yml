# Agent-change gate: re-triage a fixed set of dev-instance tickets in the
# Foundry TEST project and score them with the Foundry evaluator catalog.
#
# This is the one workflow that INVOKES agents rather than scoring recorded
# traces. It is safe only because automation-solutions-test is wired to the
# dev ConnectWise instance.
#
# It is pinned to the `staging` branch and the test project, and it has no
# production counterpart on purpose. "main deploys to production" does not
# apply here: running this against automation-solutions would re-triage real
# tickets and the ops agent would write the results into the system of record.
# Production is evaluated from recorded traces only — see evals.yml.
#
# The action reports confidence intervals and tests for statistical
# significance against `baseline-agent-id`, which is handoff §10 item 9
# (telling a flaky agent from a broken one) for no code of ours.
#
# Triggered from the agents repo after a release to staging:
#
#   curl -X POST -H "Accept: application/vnd.github+json" \
#     -H "Authorization: Bearer $GITHUB_TOKEN" \
#     https://api.github.com/repos/verve-it/automation-solutions-evaluations/dispatches \
#     -d '{"event_type":"agent-change",
#          "client_payload":{"agent_ids":"triage-analysis-agent:83",
#                            "baseline_agent_id":"triage-analysis-agent:82"}}'
#
# Deliberately NOT a required check on the agents repo by default. If a broken
# eval can block an agent hotfix, someone disables the gate under pressure and
# it never comes back. Make it required once it has earned the trust.

name: staging replay

on:
  push:
    branches: [staging]
    paths:
      - "replay/**"
      - ".github/workflows/staging-replay.yml"
  workflow_dispatch:
    inputs:
      agent-ids:
        description: "agent-name:version, comma separated"
        required: true
      baseline-agent-id:
        description: "agent-name:version to compare against"
        required: false
  repository_dispatch:
    types: [agent-change]

permissions:
  id-token: write
  contents: read

env:
  # Hard-coded rather than read from a variable. A mis-set environment
  # variable must not be able to point agent invocation at production.
  REQUIRED_PROJECT: automation-solutions-test

jobs:
  replay:
    name: replay against automation-solutions-test
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v4

      - name: Azure login using federated credentials
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # This job writes to ConnectWise. Fail loudly rather than discover the
      # mistake in a production ticket's audit trail.
      - name: Refuse to run outside the test project
        env:
          ENDPOINT: ${{ vars.AZURE_AI_PROJECT_ENDPOINT }}
        run: |
          if [ -z "$ENDPOINT" ]; then
            echo "::error::AZURE_AI_PROJECT_ENDPOINT is not set on the 'test' environment."
            exit 1
          fi
          case "$ENDPOINT" in
            *"$REQUIRED_PROJECT"*)
              echo "endpoint targets $REQUIRED_PROJECT: ok" ;;
            *)
              echo "::error::Endpoint does not target $REQUIRED_PROJECT. This job invokes agents and writes to ConnectWise. Refusing."
              exit 1 ;;
          esac

      - name: Check the replay set has real ticket ids
        run: |
          if grep -q 'TICKET_ID_' replay/full-triage.json; then
            echo "::error::replay/full-triage.json still has TICKET_ID_ placeholders. See replay/README.md."
            exit 1
          fi

      - name: Replay and evaluate
        uses: microsoft/ai-agent-evals@v3-beta
        with:
          azure-ai-project-endpoint: ${{ vars.AZURE_AI_PROJECT_ENDPOINT }}
          deployment-name: ${{ vars.AZURE_JUDGE_DEPLOYMENT }}
          agent-ids: >-
            ${{ github.event.inputs.agent-ids
                || github.event.client_payload.agent_ids }}
          baseline-agent-id: >-
            ${{ github.event.inputs.baseline-agent-id
                || github.event.client_payload.baseline_agent_id }}
          data-path: ${{ github.workspace }}/replay/full-triage.json
